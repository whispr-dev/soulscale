# Delete saved match files (text logs, round CSVs, replays) once they're 12 months old,
# as the privacy policy promises. systemd's daily tmpfiles clean-up timer applies it.
#   sudo cp deploy/soulscale-tmpfiles.conf /etc/tmpfiles.d/soulscale.conf
#   sudo systemd-tmpfiles --clean /etc/tmpfiles.d/soulscale.conf     # apply now (optional)
# "m:" = judge age by last modification only, so backups reading the files don't keep them alive.
e /opt/soulscale/data/replays - - - m:365d
