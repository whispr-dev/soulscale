[package]
name = "soulscale-core"
description = "Soulscale rules engine: deterministic, no I/O, faithful port of the v1.0.1 Python engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
default = []
# `cargo test -p soulscale-core --features ts` regenerates client/src/protocol/generated/*.ts
ts = ["dep:ts-rs"]

[dev-dependencies]
flate2 = "=1.1.11"
